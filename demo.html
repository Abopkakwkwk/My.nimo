<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Telegram Gift Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
  body {
    background: #111;
    color: #fff;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
  }
  #gift-animation {
    width: 300px;
    height: 300px;
    background: #1c1c1e;
    border-radius: 24px;
  }
  input, button {
    margin-top: 16px;
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
  }
  button {
    background: #2ea6ff;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h2>Telegram Gift Viewer</h2>
  <div id="gift-animation"></div>

  <input id="giftInput" type="text" value="PlushPepe-1" placeholder="e.g. PlushPepe-1" />
  <button onclick="loadGift()">Load Gift</button>

  <script>
    // Replace with your deployed Worker URL
    const WORKER_URL = "https://gift-proxy.YOUR-SUBDOMAIN.workers.dev";

    let anim = null;

    function loadGift() {
      const gift = document.getElementById("giftInput").value.trim();
      if (!gift) return;

      if (anim) {
        anim.destroy();
      }

      anim = lottie.loadAnimation({
        container: document.getElementById("gift-animation"),
        renderer: "svg",
        loop: true,
        autoplay: true,
        path: `${WORKER_URL}/?gift=${encodeURIComponent(gift)}`,
      });
    }

    // Load default gift on page load
    loadGift();
  </script>
</body>
</html>
